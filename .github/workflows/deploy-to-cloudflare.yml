# FR-P2-21: "Deploy to Cloudflare" ワンクリックデプロイ
# Fork したユーザーが GitHub Actions Secrets を設定するだけでデプロイできる。
#
# 単一の Cloudflare Pages インスタンス（pixletter）が
# ダッシュボードの静的ファイルと API (_worker.js) の両方を配信する。
# 別途 Workers デプロイは行わない。
#
# 必要な Secrets:
#   CLOUDFLARE_API_TOKEN  — Cloudflare API Token with:
#                           • Cloudflare Pages: Edit  (deploy)
#                           • D1: Edit               (migrations)
#   CLOUDFLARE_ACCOUNT_ID — Cloudflare Account ID
#   D1_DATABASE_NAME      — D1 database name (default: pixletter-db)
#
# NOTE: This workflow ONLY deploys code + runs D1 migrations. It does NOT
# manage Pages bindings, vars or secrets — those are configured once by hand
# in the Cloudflare dashboard (see SELF-HOST-GUIDE.md). Keeping them out of
# CI means secrets you set manually are never overwritten on redeploy.

name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      d1_database_name:
        description: 'D1 database name'
        default: 'pixletter-db'
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy single Pages instance (Dashboard + API)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          echo "Checking esbuild environment..."
          env | grep -i ESBUILD || true
          unset ESBUILD_BINARY_PATH
          pnpm install --no-frozen-lockfile --force

      - name: Create D1 database (if not exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 create ${{ inputs.d1_database_name }} 2>/dev/null || echo "Database already exists"

      - name: Run migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for f in packages/db/migrations/*.sql; do
            echo "Applying $f..."
            # Remove statement-breakpoint markers
            sed 's/--> statement-breakpoint//g' "$f" > /tmp/migration.sql
            npx wrangler d1 execute ${{ inputs.d1_database_name }} --remote --file=/tmp/migration.sql --config=apps/api/wrangler.toml || true
          done

      - name: Seed self tenant
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute ${{ inputs.d1_database_name }} --remote --config=apps/api/wrangler.toml \
            --command="INSERT OR IGNORE INTO tenants (id, name, plan, monthly_email_limit, reset_at) VALUES ('self', 'Self', 'self', 100000, unixepoch() + 2592000); INSERT OR IGNORE INTO users (id, tenant_id, email, name) VALUES ('self', 'self', 'self@localhost', 'Self User');"

      # Builds the dashboard AND bundles apps/api into dist/_worker.js.
      # VITE_API_URL is intentionally unset: API requests use same-origin
      # relative paths, so one Pages instance serves everything.
      - name: Build Pages app (Dashboard + API worker)
        run: pnpm --filter @pixletter/dashboard build

      # Create the project only if missing. Bindings, vars and secrets are
      # configured manually in the dashboard, NOT via wrangler.toml — keeping
      # them out of the config leaves dashboard fields editable. Do not add
      # `pages_build_output_dir` / `[[d1_databases]]` / `[vars]` back to
      # apps/dashboard/wrangler.toml or the dashboard turns read-only again.
      - name: Create Pages Project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages project create pixletter --production-branch=main || true

      # Bindings / vars / secrets are intentionally NOT managed here.
      # Configure them once in the Cloudflare dashboard so manual edits stick.
      # _worker.js inside dist supplies all dynamic routes. One instance.
      - name: Deploy single Pages instance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: apps/dashboard
        run: npx wrangler pages deploy dist --branch=main --project-name=pixletter
