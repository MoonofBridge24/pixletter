<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pixletter 设置</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: 'Google Sans', 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 13px;
      color: #202124;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1 .logo { font-size: 20px; }
    .field {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #5f6368;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input[type="text"], input[type="url"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #1a73e8;
    }
    .toggle-field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }
    .toggle-field label {
      text-transform: none;
      font-size: 13px;
      color: #202124;
      margin-bottom: 0;
    }
    .switch {
      position: relative;
      width: 36px;
      height: 20px;
    }
    .switch input { display: none; }
    .slider {
      position: absolute;
      inset: 0;
      background: #dadce0;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 2px;
      top: 2px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .switch input:checked + .slider {
      background: #1a73e8;
    }
    .switch input:checked + .slider::before {
      transform: translateX(16px);
    }
    .btn {
      width: 100%;
      padding: 8px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn:hover { background: #1557b0; }
    .status {
      font-size: 11px;
      color: #5f6368;
      margin-top: 8px;
      min-height: 16px;
    }
    .status--ok { color: #2e7d32; }
    .status--err { color: #c62828; }
    .hint {
      font-size: 10px;
      color: #80868b;
      margin-top: 4px;
      line-height: 1.4;
    }
    .hint a { color: #1a73e8; text-decoration: none; }
  </style>
</head>
<body>
  <h1><span class="logo">📬</span> pixletter</h1>

  <div class="field">
    <label>API 地址</label>
    <input type="url" id="apiUrl" placeholder="https://pixletter.pages.dev">
  </div>

  <div class="field">
    <label>API 密钥（可选）</label>
    <input type="text" id="apiKey" placeholder="Bearer 令牌">
  </div>

  <div class="field">
    <label>Server酱³ SendKey（可选）</label>
    <input type="text" id="serverchanSendkey" placeholder="sctp123456t..." autocomplete="off" spellcheck="false">
    <div class="hint">已读时推送。在 <a href="https://sc3.ft07.com" target="_blank" rel="noopener">sc3.ft07.com</a> 登录后复制 SendKey（也可直接粘贴 SendKey 页面给出的完整链接）。</div>
  </div>

  <div class="toggle-field">
    <label>默认开启邮件追踪</label>
    <label class="switch">
      <input type="checkbox" id="trackByDefault" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-field">
    <label>在邮件中显示退订页脚</label>
    <label class="switch">
      <input type="checkbox" id="showOptoutFooter">
      <span class="slider"></span>
    </label>
  </div>

  <button class="btn" id="save">保存设置</button>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
