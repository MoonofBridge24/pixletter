name = "pixletter-api"
main = "src/index.ts"
compatibility_date = "2026-05-14"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "pixletter-db"
# 仅供本地 wrangler dev / --local 迁移使用（合法 UUID 占位即可）。
# 线上 --remote 命令不要带 --config，wrangler 会按 database_name 从 API 解析真实 ID，
# 避免因这里的占位值导致 "Invalid uuid" 错误。
database_id = "00000000-0000-0000-0000-000000000000"

# 環境変数（公開しても安全なもの）
[vars]
HOSTING_MODE = "hosted"  # Phase 2: マルチテナント認証有効
ALLOWED_ORIGINS = "https://your-dashboard.pages.dev" # 请替换为你自己的域名（线上 Pages 以面板中的变量为准）
ALLOW_SIGNUP = "false"

# Secrets（wrangler secret put で設定）:
#   - SENTRY_DSN
#   - SERVERCHAN_SENDKEY (optional, 全ユーザー共通の Server酱³ SendKey)
#   - PIXEL_DOMAIN (例: "your-domain.pages.dev")

# レート制限（Phase 2 で有効化）
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 100, period = 60 }

# 観測性
[observability]
enabled = true
head_sampling_rate = 1.0

# ルーティング設定（Day 7 でカスタムドメイン取得時に有効化）
# [[routes]]
# pattern = "api.pixletter.dev/*"
# zone_name = "pixletter.dev"
