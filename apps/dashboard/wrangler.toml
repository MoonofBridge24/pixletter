# Cloudflare Pages — local-development config only.
#
# IMPORTANT: This file deliberately does NOT declare `pages_build_output_dir`,
# `[[d1_databases]]` or `[vars]`. In Cloudflare Pages, the moment ANY of those
# keys appear, wrangler.toml becomes the project's "source of truth" and the
# dashboard's Variables/Secrets and Bindings turn READ-ONLY (greyed out).
# Keeping them out makes the Cloudflare DASHBOARD the editable source of truth
# for vars + bindings, while this file is used for local `wrangler pages dev`.
#
# Live configuration (set once in the dashboard, editable any time):
#   Workers & Pages -> pixletter -> Settings
#     - Environment variables: HOSTING_MODE, ALLOW_SIGNUP, ALLOWED_ORIGINS
#       (add in BOTH Production and Preview)
#     - Functions -> Bindings -> D1 database, variable name `DB`
#     - Secrets via: wrangler pages secret put <NAME> --project-name=pixletter
#
# If the dashboard fields are greyed out, it means a previous deploy used a
# config with the keys above. Remove them here and redeploy once to unlock.

name = "pixletter"
compatibility_date = "2026-05-14"
compatibility_flags = ["nodejs_compat"]
